; Claude session-status display — ESP32-C3 SuperMini + 0.42" OLED
; Build & flash:  pio run -t upload      Monitor:  pio device monitor
[env:esp32-c3-042]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; ESP32-C3 has ONLY the native USB Serial/JTAG controller — route Serial to
; USB-CDC so `Serial` is the /dev/ttyACM* the hook writes to.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    olikraus/U8g2 @ ^2.35.30
