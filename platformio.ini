; Claude session-status display — ESP32-C3 SuperMini + 0.42" OLED
;
; Two build targets from ONE source tree — the device's "brain" (state model,
; OLED render, LED, serial debugger) is identical; only the TRANSPORT differs:
;   pio run -e usb   -t upload      USB-serial  (default; the board ships this way)
;   pio run -e wifi  -t upload      WiFi: HTTP endpoint + mDNS claude-status.local
; `pio run -t upload` (no -e) uses `default_envs` below == usb, so nothing changes
; for the serial workflow.
[platformio]
default_envs = usb

; ---- shared base: every [env:*] inherits these ---------------------------
[env]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
; ESP32-C3 has ONLY the native USB Serial/JTAG controller — route Serial to
; USB-CDC so `Serial` is the /dev/ttyACM* the debugger (and, in the USB build,
; the hook) talks to.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    olikraus/U8g2 @ ^2.35.30

; ---- USB-serial transport (default, unchanged from before) ---------------
[env:usb]
; nothing extra — the base above is the original USB build.

; ---- WiFi transport ------------------------------------------------------
; Adds an HTTP endpoint, mDNS, multi-network memory (WiFiMulti + NVS) and a
; captive-portal for provisioning. WiFi + web + portal don't fit the default
; app partition, so use the OTA-less huge_app layout (~3 MB app).
[env:wifi]
build_flags =
    ${env.build_flags}
    -D CS_TRANSPORT_WIFI=1
lib_deps =
    ${env.lib_deps}
    tzapu/WiFiManager @ ^2.0.17
board_build.partitions = huge_app.csv
